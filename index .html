    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1615; --surface:#15211F; --surface-2:#1C2A27;
    --ink:#E9F1EF; --muted:#9CB0AC; --line:#263733;
    --primary:#4FB6A9; --primary-soft:#123430; --primary-ink:#B9E4DE;
    --alert:#E0A24A; --alert-soft:#31230F; --alert-ink:#F0C888;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Readex Pro','Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.5}
  .app{max-width:var(--maxw); margin:0 auto; padding:0 14px 40px; min-height:100vh}
  .top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:18px 4px 12px}
  .brand{display:flex; align-items:center; gap:11px; min-width:0}
  .crest{flex:0 0 auto; width:46px; height:46px; border-radius:12px; overflow:hidden; box-shadow:var(--shadow); background:var(--surface)}
  .crest img{width:100%; height:100%; object-fit:cover; display:block}
  .brand-t{min-width:0}
  .brand-t h1{font-size:16.5px; font-weight:600; margin:0; letter-spacing:-.2px}
  .brand-t p{font-size:10px; color:var(--muted); margin:2px 0 0; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; max-width:230px}
  .icon-btn{flex:0 0 auto; width:38px; height:38px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:17px; cursor:pointer; display:grid; place-items:center}
  .icon-btn:active{transform:scale(.95)}
  .class-btn{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius);
    padding:13px 15px; cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:space-between;
    gap:10px; box-shadow:var(--shadow); font-family:inherit; text-align:inherit}
  .class-btn .lbl{display:flex; flex-direction:column; align-items:flex-start; gap:1px}
  .class-btn .lbl small{font-size:11px; color:var(--muted)}
  .class-btn .lbl b{font-size:17px; font-weight:600}
  .class-btn .caret{color:var(--primary); font-size:13px; font-weight:700}
  .weeknav{display:flex; align-items:stretch; gap:8px; margin-top:10px}
  .weeknav .nav{flex:0 0 auto; width:56px; border:1px solid var(--line); background:var(--surface);
    border-radius:var(--radius-sm); cursor:pointer; color:var(--primary); font-size:30px; font-weight:700; display:grid;
    place-items:center; font-family:inherit}
  .weeknav .nav:disabled{opacity:.35; cursor:default; color:var(--muted)}
  .weeknav .nav:active:not(:disabled){background:var(--primary-soft)}
  .weekcenter{flex:1 1 auto; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-sm);
    padding:8px 12px; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
  .weekcenter .wk{font-size:15px; font-weight:600}
  .weekcenter .rg{font-size:12px; color:var(--muted)}
  .weekcenter.is-now{background:var(--primary-soft); border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft) inset}
  .now-tag{display:inline-block; margin-top:1px; font-size:10.5px; font-weight:600; color:var(--primary-ink);
    background:var(--primary-soft); padding:2px 9px; border-radius:20px}
  .glance{margin-top:14px; display:flex; gap:9px}
  .stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 13px; display:flex; align-items:center; gap:10px}
  .stat .num{font-size:24px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
  .stat .cap{font-size:12px; color:var(--muted); line-height:1.35}
  .stat.tests .num{color:var(--alert)}
  .stat.hw .num{color:var(--primary)}
  .stat .ic{font-size:17px; opacity:.9}
  .listhead{display:flex; align-items:center; justify-content:space-between; margin:20px 4px 10px}
  .listhead .cnt{font-size:13px; color:var(--muted)}
  .listhead .cnt b{color:var(--ink); font-weight:600}
  .toggle-all{border:none; background:none; color:var(--primary); font-weight:500; font-size:13px; cursor:pointer;
    font-family:inherit; padding:4px 2px}
  .cards{display:flex; flex-direction:column; gap:10px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .card.has-test{border-color:color-mix(in srgb, var(--alert) 40%, var(--line))}
  .card-head{width:100%; border:none; background:none; cursor:pointer; font-family:inherit; color:var(--ink);
    display:flex; align-items:center; gap:12px; padding:13px 14px; text-align:inherit}
  .mono{flex:0 0 auto; width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
    font-size:19px; color:#fff}
  .head-mid{flex:1 1 auto; min-width:0}
  .head-mid .sn{font-size:15.5px; font-weight:600; display:block}
  .head-mid .tch{font-size:11.5px; color:var(--muted); display:block; margin-top:1px}
  .head-mid .badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
  .badge{font-size:11px; font-weight:500; padding:2.5px 9px; border-radius:20px; white-space:nowrap}
  .badge.test{background:var(--alert-soft); color:var(--alert-ink)}
  .badge.note{background:var(--primary-soft); color:var(--primary-ink)}
  .badge.none{background:var(--surface-2); color:var(--muted)}
  .chev{flex:0 0 auto; color:var(--muted); font-size:15px; transition:transform .22s ease}
  .card.open .chev{transform:rotate(-90deg)}
  .card-body{display:none; padding:0 14px 15px; padding-inline-start:64px}
  .card.open .card-body{display:block}
  .row{padding-top:11px; border-top:1px solid var(--line); margin-top:11px}
  .row:first-child{border-top:none; margin-top:0; padding-top:2px}
  .row .rl{font-size:11.5px; font-weight:600; color:var(--muted); margin-bottom:3px}
  .row .rv{font-size:14.5px; line-height:1.6; word-break:break-word}
  .alertbox{background:var(--alert-soft); border-radius:12px; padding:11px 13px; margin-top:12px; display:flex;
    gap:11px; align-items:flex-start}
  .alertbox .ai{font-size:17px; line-height:1.2}
  .alertbox .at{font-size:11.5px; font-weight:600; color:var(--alert-ink); margin-bottom:2px}
  .alertbox .av{font-size:14.5px; font-weight:500}
  .change-teacher{border:none; background:none; color:var(--primary); font-size:12.5px; font-weight:500; cursor:pointer;
    font-family:inherit; padding:10px 0 0; margin-top:11px; border-top:1px solid var(--line); width:100%; text-align:start}
  .soft-note{color:var(--muted); font-size:13.5px; padding-top:2px; line-height:1.6}
  /* chooser */
  .card.chooser{border-color:color-mix(in srgb, var(--primary) 38%, var(--line))}
  .chooser-head{display:flex; align-items:flex-start; gap:12px; padding:13px 14px 2px}
  .chooser-head .sn{font-size:15.5px; font-weight:600}
  .chooser-head .tch{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.5}
  .chooser-q{font-size:12.5px; color:var(--primary-ink); font-weight:600; padding:8px 14px 0; padding-inline-start:64px}
  .chooser-opts{display:flex; flex-direction:column; gap:8px; padding:10px 14px 14px; padding-inline-start:64px}
  .tchoice{width:100%; text-align:inherit; border:1px solid var(--line); background:var(--surface); border-radius:11px;
    padding:11px 13px; cursor:pointer; color:var(--ink); font-family:inherit; font-size:14.5px; font-weight:500;
    display:flex; align-items:center; justify-content:space-between; gap:8px}
  .tchoice:active{transform:scale(.99)}
  .tchoice .has{font-size:10.5px; font-weight:600; color:var(--primary-ink); background:var(--primary-soft);
    padding:2px 8px; border-radius:20px; white-space:nowrap}
  .empty-block{background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius);
    padding:26px 18px; text-align:center; color:var(--muted); font-size:14px; line-height:1.7}
  .empty-block .big{font-size:26px; display:block; margin-bottom:8px; opacity:.7}
  .foot{margin-top:22px; display:flex; flex-direction:column; gap:12px; align-items:center}
  .pdf-btn{width:100%; border:1px solid var(--primary); background:var(--primary-soft); color:var(--primary-ink);
    border-radius:var(--radius); padding:13px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:9px}
  .pdf-btn:active{transform:scale(.99)}
  .sync{font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; text-align:center}
  .credits{margin-top:8px; text-align:center; color:var(--muted); font-size:11px; line-height:1.75}
  .credits .ct{font-weight:600; color:var(--ink); font-size:12.5px}
  .credits a{color:var(--primary); text-decoration:none; font-weight:500}
  .credits .contact{margin-top:5px}
  .ann-scrim{position:fixed; inset:0; background:rgba(10,25,45,.55); display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:80; opacity:0; animation:annfade .25s ease forwards}
  .ann-scrim[hidden]{display:none}
  @keyframes annfade{to{opacity:1}}
  .ann-modal{background:var(--surface); border:1px solid var(--line); border-radius:20px; max-width:400px; width:100%;
    padding:24px 22px 22px; text-align:center; box-shadow:0 24px 60px -20px rgba(0,0,0,.5); transform:translateY(10px);
    animation:annpop .28s cubic-bezier(.22,.61,.36,1) forwards}
  @keyframes annpop{to{transform:none}}
  .ann-modal .ann-ic{width:54px; height:54px; border-radius:50%; background:var(--primary-soft);
    display:grid; place-items:center; font-size:26px; margin:0 auto 14px}
  .ann-modal h3{margin:0 0 8px; font-size:18px; color:var(--ink); font-weight:600}
  .ann-modal p{margin:0 0 20px; font-size:14.5px; color:var(--muted); line-height:1.75; white-space:pre-wrap}
  .ann-close{border:none; background:var(--primary); color:#fff; border-radius:12px; padding:12px 30px; font-size:15px;
    font-weight:600; cursor:pointer; font-family:inherit; min-width:140px}
  .ann-close:active{transform:scale(.98)}
  @media (prefers-reduced-motion:reduce){.ann-scrim,.ann-modal{animation:none; opacity:1; transform:none}}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--primary); flex:0 0 auto}
  .scrim{position:fixed; inset:0; background:rgba(10,20,18,.42); opacity:0; pointer-events:none;
    transition:opacity .2s ease; z-index:40}
  .scrim.on{opacity:1; pointer-events:auto}
  .sheet{position:fixed; inset-inline:0; bottom:0; z-index:50; background:var(--surface); border-radius:22px 22px 0 0;
    padding:8px 14px calc(18px + env(safe-area-inset-bottom)); max-width:var(--maxw); margin:0 auto;
    transform:translateY(102%); transition:transform .26s cubic-bezier(.22,.61,.36,1);
    box-shadow:0 -12px 40px -20px rgba(0,0,0,.5); max-height:80vh; overflow-y:auto}
  .sheet.on{transform:translateY(0)}
  .grab{width:38px; height:4px; border-radius:4px; background:var(--line); margin:6px auto 12px}
  .sheet h3{font-size:14px; margin:0 4px 10px; color:var(--muted); font-weight:600}
  .opt{width:100%; text-align:inherit; border:1px solid var(--line); background:var(--surface); border-radius:12px;
    padding:13px 15px; margin-bottom:8px; cursor:pointer; color:var(--ink); font-family:inherit; font-size:15.5px;
    font-weight:500; display:flex; align-items:center; justify-content:space-between}
  .opt small{font-size:12px; color:var(--muted); font-weight:400; margin-inline-start:8px}
  .opt.sel{border-color:var(--primary); background:var(--primary-soft); color:var(--primary-ink)}
  .opt .tick{color:var(--primary); font-weight:700; opacity:0}
  .opt.sel .tick{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
  :focus-visible{outline:2.5px solid var(--primary); outline-offset:2px; border-radius:6px}
  @media print{
    body{background:#fff}
    .top .icon-btn,.weeknav .nav,.class-btn .caret,.toggle-all,.foot,.scrim,.sheet,.change-teacher{display:none !important}
    .print-head{display:block !important}
    .card{break-inside:avoid; border:1px solid #ccc; box-shadow:none}
    .card-body{display:block !important}
    .chev{display:none}
    .app{max-width:100%}
  }
  .print-head{display:none; margin:0 4px 12px}
  .print-head h2{margin:0; font-size:18px}
  .print-head p{margin:3px 0 0; color:#555; font-size:13px}
</style>
</head>

    $('glance').innerHTML=
      '<div class="stat hw"><span class="ic">📚</span><div><div class="num">'+ar(Object.keys(subs).length)+'</div><div class="cap">مواد لها خطة</div></div></div>'+
      '<div class="stat tests"><span class="ic">📝</span><div><div class="num">'+ar(tests)+'</div><div class="cap">اختبارات هذا الأسبوع</div></div></div>';
  }

  function normalCard(x, multi){
    var hasTest=!!x.exam, open=expandedAll||hasTest;
    var card=document.createElement('article');
    card.className='card'+(hasTest?' has-test':'')+(open?' open':'');
    var badges='';
    if(hasTest)badges+='<span class="badge test">اختبار</span>';
    if(x.note)badges+='<span class="badge note">ملاحظة</span>';
    if(x.reminder)badges+='<span class="badge note">تذكير</span>';
    if(!badges)badges='<span class="badge none">درس</span>';
    var head=document.createElement('button');head.className='card-head';
    head.setAttribute('aria-expanded',open?'true':'false');
    head.innerHTML='<span class="mono" style="background:'+x.tint+'">'+x.emoji+'</span>'+
      '<span class="head-mid"><span class="sn">'+esc(x.subject)+'</span>'+
      (x.teacher?'<span class="tch">معلم المادة: '+esc(x.teacher)+'</span>':'')+
      '<span class="badges">'+badges+'</span></span><span class="chev">‹</span>';
    var body=document.createElement('div');body.className='card-body';
    var h='<div class="row"><div class="rl">الدرس / الخطة</div><div class="rv">'+esc(x.lesson)+'</div></div>';
    if(x.note)h+='<div class="row"><div class="rl">ملاحظة</div><div class="rv">'+esc(x.note)+'</div></div>';
    if(x.reminder)h+='<div class="row"><div class="rl">تذكير</div><div class="rv">'+esc(x.reminder)+'</div></div>';
    if(x.exam)h+='<div class="alertbox"><span class="ai">📝</span><div><div class="at">موعد اختبار</div><div class="av">'+esc(x.exam)+'</div></div></div>';
    body.innerHTML=h;
    if(multi){
      var chg=document.createElement('button');chg.className='change-teacher';
      chg.textContent='↺ معلّم آخر لهذه المادة';
      chg.addEventListener('click',function(ev){ev.stopPropagation();clearChoice(selCode,x.subject);renderCards()});
      body.appendChild(chg);
    }
    head.addEventListener('click',function(){var o=card.classList.toggle('open');head.setAttribute('aria-expanded',o?'true':'false')});
    card.appendChild(head);card.appendChild(body);return card;
  }

  function chooserCard(subject, teachers, thisWeek){
    var m=subjMetaMap[subject]||{emoji:'📘',tint:'#556'};
    var here={}; thisWeek.forEach(function(x){here[x.teacher]=1});
    var card=document.createElement('article');card.className='card chooser';
    var html='<div class="chooser-head"><span class="mono" style="background:'+m.tint+'">'+m.emoji+'</span>'+
      '<div><div class="sn">'+esc(subject)+'</div><div class="tch">يدرّس هذه المادة أكثر من معلّم في هذه الشعبة</div></div></div>'+
      '<div class="chooser-q">اختر معلّم ابنك — يُحفظ اختيارك ولن يُسأل مجدداً:</div>'+
      '<div class="chooser-opts"></div>';
    card.innerHTML=html;
    var opts=card.querySelector('.chooser-opts');
    teachers.forEach(function(t){
      var b=document.createElement('button');b.className='tchoice';
      b.innerHTML='<span>'+esc(t)+'</span>'+(here[t]?'<span class="has">خطة هذا الأسبوع</span>':'');
      b.addEventListener('click',function(){setChoice(selCode,subject,t);renderCards()});
      opts.appendChild(b);
    });
    return card;
  }

  function missingChosenCard(subject, teacher){
    var m=subjMetaMap[subject]||{emoji:'📘',tint:'#556'};
    var card=document.createElement('article');card.className='card open';
    var head=document.createElement('div');head.className='card-head';head.style.cursor='default';
    head.innerHTML='<span class="mono" style="background:'+m.tint+'">'+m.emoji+'</span>'+
      '<span class="head-mid"><span class="sn">'+esc(subject)+'</span>'+
      '<span class="tch">معلم المادة: '+esc(teacher)+'</span></span>';
    var body=document.createElement('div');body.className='card-body';
    body.innerHTML='<div class="soft-note">لم يُدخل الأستاذ '+esc(teacher)+' خطة هذه المادة هذا الأسبوع بعد.</div>';
    var chg=document.createElement('button');chg.className='change-teacher';chg.textContent='↺ تغيير المعلّم';
    chg.addEventListener('click',function(){clearChoice(selCode,subject);renderCards()});
    body.appendChild(chg);
    card.appendChild(head);card.appendChild(body);return card;
  }

  function renderCards(){
    cardsEl.innerHTML='';
    if(!weekHasAny()){cardsEl.innerHTML='<div class="empty-block"><span class="big">🗓️</span>لم تُنشر خطة هذا الأسبوع بعد.<br>ستظهر تلقائياً فور إدخال المعلمين لها في الملف.</div>';$('subjCount').textContent=ar(0);return;}
    var e=entries();
    if(!e.length){cardsEl.innerHTML='<div class="empty-block"><span class="big">📭</span>لا توجد مواد منشورة لهذه الشعبة هذا الأسبوع.</div>';$('subjCount').textContent=ar(0);return;}
    var order=[],bySubj={};
    e.forEach(function(x){if(!bySubj[x.subject]){bySubj[x.subject]=[];order.push(x.subject)}bySubj[x.subject].push(x)});
    order.forEach(function(subject){
      var union=unionTeachers[selCode][subject]||[];
      var tw=bySubj[subject];
      if(union.length<=1){tw.forEach(function(x){cardsEl.appendChild(normalCard(x,false))});return;}
      var choice=getChoice(selCode,subject);
      if(!choice){cardsEl.appendChild(chooserCard(subject,union,tw));return;}
      var chosen=null;for(var i=0;i<tw.length;i++){if(tw[i].teacher===choice){chosen=tw[i];break}}
      if(chosen)cardsEl.appendChild(normalCard(chosen,true));
      else cardsEl.appendChild(missingChosenCard(subject,choice));
    });
    $('subjCount').textContent=ar(order.length);
  }

  function renderWeek(){
    var w=weeks[wkIndex];
    $('wkLabel').textContent=w.label;$('wkRange').textContent=w.range;
    $('nowTag').style.display=(wkIndex===D.currentWeekIndex)?'inline-block':'none';
    $('weekCenter').classList.toggle('is-now', wkIndex===D.currentWeekIndex);
    $('prevWk').disabled=(wkIndex===0);$('nextWk').disabled=(wkIndex===weeks.length-1);
    $('printHead').innerHTML='<h2>'+labelOf(selCode)+' — '+w.label+'</h2><p>الخطة الأسبوعية · '+w.range+' · '+D.school+'</p>';
  }
  function renderAll(){$('classLabel').textContent=labelOf(selCode);renderWeek();renderGlance();renderCards()}
  $('schoolLine').textContent=D.school;
  $('prevWk').addEventListener('click',function(){if(wkIndex>0){wkIndex--;renderAll()}});
  $('nextWk').addEventListener('click',function(){if(wkIndex<weeks.length-1){wkIndex++;renderAll()}});
  $('toggleAll').addEventListener('click',function(){expandedAll=!expandedAll;this.textContent=expandedAll?'طيّ الكل':'توسيع الكل';renderCards()});
  var scrim=$('scrim'),sheet=$('sheet');
  function openSheet(){buildOpts();scrim.classList.add('on');sheet.classList.add('on')}
  function closeSheet(){scrim.classList.remove('on');sheet.classList.remove('on')}
  function buildOpts(){
    var box=$('classOpts');box.innerHTML='';
    sections.forEach(function(sec){
      var subs={};(weeks[wkIndex].sections[sec.code]||[]).forEach(function(x){subs[x.subject]=1});
      var n=Object.keys(subs).length;
      var b=document.createElement('button');b.className='opt'+(sec.code===selCode?' sel':'');
      b.innerHTML='<span>'+sec.label+'<small>'+sec.code+' · '+ar(n)+' مواد</small></span><span class="tick">✓</span>';
      b.addEventListener('click',function(){selCode=sec.code;expandedAll=false;$('toggleAll').textContent='توسيع الكل';renderAll();closeSheet()});
      box.appendChild(b);
    });
  }
  $('classBtn').addEventListener('click',openSheet);scrim.addEventListener('click',closeSheet);
  $('pdfBtn').addEventListener('click',function(){window.print()});
  $('themeBtn').addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next=dark?'light':'dark';document.documentElement.setAttribute('data-theme',next);
    this.textContent=next==='dark'?'☀':'☾';
  });
  renderAll();
}

function annHash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return String(h)}
function showAnnouncement(a){
  if(!a || !a.body) return;
  var key='ssuae_ann_seen';
  var hash=annHash((a.title||'')+'\u0001'+a.body);
  try{ if(localStorage.getItem(key)===hash) return; }catch(e){}
  var scrim=document.getElementById('annScrim');
  document.getElementById('annTitle').textContent=a.title||'إعلان';
  document.getElementById('annBody').textContent=a.body;
  scrim.hidden=false;
  function close(){ scrim.hidden=true; try{localStorage.setItem(key,hash)}catch(e){} }
  document.getElementById('annClose').addEventListener('click',close);
  scrim.addEventListener('click',function(e){ if(e.target===scrim) close(); });
}
async function boot(){
  var data=null, live=false;
  try{
    var ctrl=new AbortController(); var to=setTimeout(function(){ctrl.abort()},7000);
    var r=await fetch('/.netlify/functions/plan',{signal:ctrl.signal, cache:'no-store'});
    clearTimeout(to);
    if(r.ok){ var j=await r.json(); if(j && j.weeks){ data=j; live=true; } }
  }catch(e){}
  if(!data){ data=window.__FALLBACK__; }
  window.__PLAN__=data;
  initApp();
  showAnnouncement(data.announcement);
  var s=document.getElementById('syncMsg');
  if(s) s.textContent = live ? 'محدّثة الآن مباشرة من ملف المدرسة'
                              : 'عرض محفوظ — ستتحدّث تلقائياً عند توفّر الاتصال';
}
boot();
</script>
