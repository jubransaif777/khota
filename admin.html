<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة متابعة المعلمين — مدرسة المعيريض</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F5F4; --surface:#FFFFFF; --surface-2:#EAF0EE; --ink:#15302D; --muted:#5E706C; --line:#DBE4E1;
    --primary:#0E5A54; --primary-soft:#E1EEEC; --primary-ink:#0B403B;
    --done:#1F8A5B; --done-soft:#E2F3EA; --partial:#B26A15; --partial-soft:#FBEEDA; --miss:#C0392B; --miss-soft:#FBE7E5;
    --radius:16px; --shadow:0 1px 2px rgba(16,45,42,.05),0 8px 24px -18px rgba(16,45,42,.35);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0D1615; --surface:#15211F; --surface-2:#1C2A27; --ink:#E9F1EF; --muted:#9CB0AC; --line:#263733;
    --primary:#4FB6A9; --primary-soft:#123430; --primary-ink:#B9E4DE;
    --done:#4FB98A; --done-soft:#123027; --partial:#E0A24A; --partial-soft:#31230F; --miss:#E8776B; --miss-soft:#3A1F1C;}}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:'Readex Pro','Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased}
  .wrap{max-width:820px; margin:0 auto; padding:20px 14px 48px}
  h1{font-size:19px; margin:0 0 2px} .sub{color:var(--muted); font-size:12.5px; margin-bottom:18px}
  /* بوابة كلمة السر */
  .gate{max-width:360px; margin:12vh auto 0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:26px 22px; box-shadow:var(--shadow); text-align:center}
  .gate .ic{font-size:34px; margin-bottom:10px}
  .gate h2{margin:0 0 6px; font-size:18px} .gate p{margin:0 0 18px; color:var(--muted); font-size:13px}
  .gate input{width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:12px; padding:13px 14px; font-family:inherit; font-size:16px; text-align:center; margin-bottom:12px}
  .btn{width:100%; border:none; background:var(--primary); color:#fff; border-radius:12px; padding:13px; font-weight:600; font-size:15px; cursor:pointer; font-family:inherit}
  .btn:active{transform:scale(.99)} .err{color:var(--miss); font-size:13px; margin-top:10px; min-height:18px}
  .hidden{display:none!important}
  /* شريط الأسابيع */
  .weeknav{display:flex; gap:8px; margin:8px 0 16px}
  .weeknav button{width:48px; border:1px solid var(--line); background:var(--surface); border-radius:11px; font-size:26px; font-weight:700; color:var(--primary); cursor:pointer; font-family:inherit}
  .weeknav button:disabled{opacity:.35}
  .weeknav .mid{flex:1; border:1px solid var(--line); background:var(--surface); border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px}
  .weeknav .mid.now{background:var(--primary-soft); border-color:var(--primary)}
  .weeknav .mid b{font-size:15px} .weeknav .mid span{font-size:11.5px; color:var(--muted)}
  /* الملخص */
  .summary{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px}
  .sc{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 8px; text-align:center}
  .sc .n{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums} .sc .t{font-size:11px; color:var(--muted)}
  .sc.done .n{color:var(--done)} .sc.partial .n{color:var(--partial)} .sc.miss .n{color:var(--miss)}
  .filterbar{display:flex; gap:8px; margin-bottom:12px}
  .filterbar button{border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:20px; padding:6px 14px; font-size:12.5px; cursor:pointer; font-family:inherit}
  .filterbar button.on{background:var(--primary-soft); color:var(--primary-ink); border-color:var(--primary); font-weight:600}
  /* الجدول */
  table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  thead th{background:var(--surface-2); font-size:11.5px; color:var(--muted); font-weight:600; padding:10px 10px; text-align:right}
  tbody td{padding:11px 10px; border-top:1px solid var(--line); font-size:13.5px; vertical-align:top}
  .tname{font-weight:600} .tsub{color:var(--muted); font-size:12px}
  .chip{display:inline-block; font-size:11px; font-weight:600; padding:2px 10px; border-radius:20px; white-space:nowrap}
  .chip.done{background:var(--done-soft); color:var(--done)} .chip.partial{background:var(--partial-soft); color:var(--partial)} .chip.missing{background:var(--miss-soft); color:var(--miss)}
  .need{color:var(--muted); font-size:11.5px; margin-top:4px}
  .count{font-variant-numeric:tabular-nums; white-space:nowrap}
  tr.st-missing td{background:color-mix(in srgb,var(--miss-soft) 45%,transparent)}
  .empty{text-align:center; color:var(--muted); padding:26px; font-size:14px}
  .foot{margin-top:16px; text-align:center; color:var(--muted); font-size:11px}
  .btn.small{width:auto; padding:8px 16px; font-size:13px; background:none; color:var(--primary); border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <!-- بوابة كلمة السر -->
  <div class="gate" id="gate">
    <div class="ic">🔒</div>
    <h2>لوحة متابعة المعلمين</h2>
    <p>هذه الصفحة خاصة بإدارة المدرسة. أدخل كلمة السرّ.</p>
    <input type="password" id="pw" placeholder="كلمة السرّ" autocomplete="off" inputmode="text">
    <button class="btn" id="enter">دخول</button>
    <div class="err" id="err"></div>
  </div>

  <!-- اللوحة -->
  <div id="panel" class="hidden">
    <h1>لوحة متابعة المعلمين</h1>
    <div class="sub">مدرسة المعيريض للحلقة الثانية بنين · إدخال الخطة الأسبوعية</div>
    <div class="weeknav">
      <button id="prev">‹</button>
      <div class="mid" id="wkmid"><b id="wklbl"></b><span id="wkrng"></span></div>
      <button id="next">›</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="filterbar">
      <button data-f="all" class="on">الكل</button>
      <button data-f="late">المتأخرون فقط</button>
    </div>
    <div id="tablebox"></div>
    <div class="foot">تُقرأ البيانات مباشرة من ملف المدرسة · لوحة إدارية</div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var DATA=null, wk=0, filter='all', PW='', secLabel={};

  function ar(n){return String(n).replace(/[0-9]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[+d]})}
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

  function auth(){
    var pw=$('pw').value.trim(); if(!pw){return}
    $('err').textContent='… جارٍ التحقق';
    fetch('/.netlify/functions/admin?pw='+encodeURIComponent(pw),{cache:'no-store'})
      .then(function(r){ return r.json().then(function(j){return {ok:r.ok,j:j}}); })
      .then(function(res){
        if(!res.ok){ $('err').textContent = res.j && res.j.error ? res.j.error : 'تعذّر الدخول'; return; }
        PW=pw; DATA=res.j; wk=DATA.currentWeekIndex||0;
        DATA.sectionOrder.forEach(function(s){secLabel[s.code]=s.label});
        $('gate').classList.add('hidden'); $('panel').classList.remove('hidden');
        render();
      })
      .catch(function(){ $('err').textContent='تعذّر الاتصال، حاول مجدداً'; });
  }

  function render(){
    var w=DATA.weeks[wk];
    $('wklbl').textContent=w.label; $('wkrng').textContent=w.range;
    $('wkmid').classList.toggle('now', wk===DATA.currentWeekIndex);
    $('prev').disabled=(wk===0); $('next').disabled=(wk===DATA.weeks.length-1);
    var s=w.summary||{total:0,done:0,partial:0,missing:0};
    $('summary').innerHTML=
      '<div class="sc"><div class="n">'+ar(s.total)+'</div><div class="t">معلّم/مادة</div></div>'+
      '<div class="sc done"><div class="n">'+ar(s.done)+'</div><div class="t">مكتمل</div></div>'+
      '<div class="sc partial"><div class="n">'+ar(s.partial)+'</div><div class="t">جزئي</div></div>'+
      '<div class="sc miss"><div class="n">'+ar(s.missing)+'</div><div class="t">متأخّر</div></div>';

    var order={missing:0,partial:1,done:2};
    var rows=(w.rows||[]).filter(function(r){return r.required.length>0});
    if(filter==='late') rows=rows.filter(function(r){return r.status!=='done'});
    rows.sort(function(a,b){return order[a.status]-order[b.status] || a.teacher.localeCompare(b.teacher,'ar')});

    if(!rows.length){ $('tablebox').innerHTML='<div class="empty">✅ لا أحد في هذه الفئة — الجميع أدخل خطته.</div>'; return; }

    var chip={done:'مكتمل',partial:'جزئي',missing:'متأخّر'};
    var html='<table><thead><tr><th>المعلّم والمادة</th><th>المُدخَل</th><th>الحالة</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var missing=r.required.filter(function(c){return r.done.indexOf(c)<0});
      var need = (r.status!=='done' && missing.length) ? '<div class="need">ناقص: '+missing.map(function(c){return esc(secLabel[c]||c)}).join('، ')+'</div>' : '';
      html+='<tr class="st-'+r.status+'"><td><div class="tname">'+esc(r.teacher)+'</div><div class="tsub">'+esc(r.subject)+'</div></td>'+
        '<td class="count">'+ar(r.done.length)+' / '+ar(r.required.length)+'</td>'+
        '<td><span class="chip '+r.status+'">'+chip[r.status]+'</span>'+need+'</td></tr>';
    });
    html+='</tbody></table>';
    $('tablebox').innerHTML=html;
  }

  $('enter').addEventListener('click',auth);
  $('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') auth(); });
  $('prev').addEventListener('click',function(){ if(wk>0){wk--;render()} });
  $('next').addEventListener('click',function(){ if(wk<DATA.weeks.length-1){wk++;render()} });
  Array.prototype.forEach.call(document.querySelectorAll('.filterbar button'),function(b){
    b.addEventListener('click',function(){
      filter=b.getAttribute('data-f');
      Array.prototype.forEach.call(document.querySelectorAll('.filterbar button'),function(x){x.classList.remove('on')});
      b.classList.add('on'); render();
    });
  });
})();
</script>
</body>
</html>
