<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المستندات والتعاميم — مدرسة المعيريض</title>
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E5A54">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F1F5F4;--surface:#FFFFFF;--ink:#15302D;--muted:#5E706C;--line:#DBE4E1;
    --primary:#0E5A54;--primary-soft:#E1EEEC;--primary-ink:#0B403B;--gold:#B8923A;--gold-soft:#FBF3DF;
    --miss:#C0392B;--miss-soft:#FBE7E5;--radius:16px;--shadow:0 1px 2px rgba(16,45,42,.05),0 8px 24px -18px rgba(16,45,42,.35);--maxw:560px}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1615;--surface:#15211F;--ink:#E9F1EF;--muted:#9CB0AC;--line:#263733;
    --primary:#4FB6A9;--primary-soft:#123430;--primary-ink:#B9E4DE;--gold:#D9B65F;--gold-soft:#2E2813;--miss:#E8776B;--miss-soft:#3A1F1C;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.7)}}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:'Readex Pro','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .app{max-width:var(--maxw);margin:0 auto;padding:0 14px 40px;min-height:100vh}
  .top{display:flex;align-items:center;gap:11px;padding:22px 4px 14px}
  .crest{width:48px;height:48px;border-radius:13px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface);border:2px solid var(--surface)}
  .crest img{width:100%;height:100%;object-fit:cover;display:block}
  .brand h1{font-size:16.5px;margin:0;font-weight:600} .brand p{font-size:11px;color:var(--muted);margin:2px 0 0}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 13px/1 inherit;font-family:inherit;cursor:pointer}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .sec{font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 4px 8px}
  .doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;margin-bottom:11px;box-shadow:var(--shadow)}
  .doc.pin{border-color:var(--gold);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
  .doc-h{display:flex;align-items:flex-start;gap:9px;margin-bottom:4px}
  .ico{flex:0 0 38px;height:38px;border-radius:11px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-size:17px}
  .doc h2{font-size:15px;line-height:1.55;margin:0;font-weight:600;flex:1}
  .badge{font-size:10.5px;font-weight:600;border-radius:999px;padding:3px 9px;margin-inline-start:6px;white-space:nowrap}
  .badge.new{background:var(--primary);color:#fff}.badge.pin{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}
  .desc{font-size:13px;color:var(--muted);margin:2px 0 8px 0;white-space:pre-line}
  .meta{font-size:11.5px;color:var(--muted);margin:0 0 12px}
  .acts{display:flex;gap:8px}
  .btn{flex:1;text-align:center;text-decoration:none;border:none;border-radius:11px;padding:11px 8px;font:600 13.5px/1.3 inherit;font-family:inherit;cursor:pointer}
  .btn.pri{background:var(--primary);color:#fff}.btn.ghost{background:var(--primary-soft);color:var(--primary-ink);border:1px solid var(--primary)}
  .btn.sm{flex:0 0 auto;padding:11px 13px}
  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:30px 18px;text-align:center;color:var(--muted);font-size:14px}
  .err{background:var(--miss-soft);color:var(--miss);border-radius:12px;padding:13px 14px;font-size:13.5px;text-align:center}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
  .back{display:block;text-align:center;margin-top:18px;color:var(--primary);text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="crest"><img alt="" src="/crest.png"></div>
    <div class="brand"><h1>المستندات والتعاميم</h1><p>مدرسة المعيريض للحلقة الثانية بنين</p></div></div>
  <div class="chips" id="chips" hidden></div>
  <div id="list" role="status" aria-live="polite"><div class="empty">… جارٍ التحميل</div></div>
  <a class="back" href="/">← العودة إلى الخطة الأسبوعية</a>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function fdate(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?(+m[3])+' '+MONTHS[+m[2]-1]+' '+m[1]:''; }
  function fsize(n){ return n>=1048576?(n/1048576).toFixed(1)+' ميغابايت':Math.max(1,Math.round(n/1024))+' كيلوبايت'; }
  function ev(n){ try{ window.SiteTrack&&SiteTrack.event(n); }catch(e){} }
  function toast(t){ var b=$('toast'); b.textContent=t; b.classList.add('on'); setTimeout(function(){ b.classList.remove('on'); },2200); }
  var API='/.netlify/functions/docs', DOCS=[], CAT='';
  function url(id,dl){ return API+'?id='+encodeURIComponent(id)+(dl?'&dl=1':''); }
  function card(d){
    return '<div class="doc'+(d.pinned?' pin':'')+'"><div class="doc-h"><div class="ico">📄</div><h2>'+esc(d.title)+
      (d.pinned?'<span class="badge pin">📌 مهم</span>':'')+(d.isNew?'<span class="badge new">جديد</span>':'')+'</h2></div>'+
      (d.desc?'<div class="desc">'+esc(d.desc)+'</div>':'')+
      '<div class="meta">'+esc(d.cat)+' · '+esc(fdate(d.date))+' · PDF · '+esc(fsize(d.size))+'</div>'+
      '<div class="acts"><a class="btn pri" data-a="open" data-id="'+esc(d.id)+'" href="'+esc(url(d.id))+'" target="_blank" rel="noopener">فتح المستند</a>'+
      '<a class="btn ghost" data-a="dl" data-id="'+esc(d.id)+'" href="'+esc(url(d.id,1))+'">تنزيل</a>'+
      '<button class="btn ghost sm" type="button" data-a="share" data-id="'+esc(d.id)+'" aria-label="مشاركة">📤</button></div></div>';
  }
  function render(){
    var cats=[]; DOCS.forEach(function(d){ if(cats.indexOf(d.cat)<0) cats.push(d.cat); });
    var ch=$('chips'); ch.hidden=cats.length<2;
    if(cats.length>=2){ ch.innerHTML='<button class="chip'+(CAT?'':' on')+'" data-c="">الكل</button>'+cats.map(function(c){ return '<button class="chip'+(CAT===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'; }).join('');
      Array.prototype.forEach.call(ch.querySelectorAll('.chip'),function(b){ b.addEventListener('click',function(){ CAT=b.getAttribute('data-c'); render(); }); }); }
    var list=DOCS.filter(function(d){ return !CAT||d.cat===CAT; });
    if(!list.length){ $('list').innerHTML='<div class="empty">لا توجد مستندات منشورة حالياً.</div>'; return; }
    $('list').innerHTML=list.map(card).join('');
    Array.prototype.forEach.call($('list').querySelectorAll('[data-a]'),function(a){ a.addEventListener('click',function(e){
      var k=a.getAttribute('data-a'), id=a.getAttribute('data-id');
      if(k==='open') ev('doc_open'); else if(k==='dl') ev('doc_download');
      else if(k==='share'){ var u=location.origin+'/docs', d=DOCS.filter(function(x){return x.id===id})[0];
        if(navigator.share){ navigator.share({title:d.title,text:d.title,url:u}).catch(function(){}); }
        else if(navigator.clipboard){ navigator.clipboard.writeText(d.title+'\n'+u).then(function(){ toast('نُسخ الرابط ✓'); }); } }
    }); });
  }
  function load(){
    fetch(API,{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      if(!j||j.status!=='ok') throw 0; DOCS=j.docs||[]; render();
    }).catch(function(){ $('list').innerHTML='<div class="err">تعذّر تحميل المستندات. تحقق من الاتصال ثم <a href="" onclick="location.reload();return false">أعد المحاولة</a>.</div>'; });
  }
  load();
})();
</script>
<script src="/site-track.js" defer></script>
</body>
</html>
