  body{font-family:'Readex Pro','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{max-width:var(--maxw);margin:0 auto;padding:0 14px 40px;min-height:100vh}
  .topnav{display:flex;gap:6px;background:var(--surface-2);border-radius:14px;padding:5px;margin:14px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .topnav a{flex:0 0 auto;white-space:nowrap;text-align:center;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px}
  .topnav a.active{background:var(--surface);color:var(--primary-ink);box-shadow:var(--shadow)}
  .top{display:flex;align-items:center;gap:11px;padding:14px 4px 12px}
  .crest{width:46px;height:46px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:var(--surface);border:2px solid var(--surface)}
  .crest img{width:100%;height:100%;object-fit:cover;display:block}
  .brand h1{font-size:16px;margin:0;font-weight:600} .brand p{font-size:10.5px;color:var(--muted);margin:2px 0 0}
  .news{display:flex;flex-direction:column;gap:11px;margin-top:6px}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
  .item.pin{border-color:color-mix(in srgb,var(--primary) 32%,var(--line))}
  .ih{display:flex;align-items:flex-start;gap:8px;margin-bottom:3px}
  .ih .t{font-size:16px;font-weight:600;flex:1;line-height:1.4}
  .pinmark{font-size:13px;flex:0 0 auto} 
  .badge-new{font-size:10px;font-weight:700;color:#fff;background:var(--alert);padding:2px 8px;border-radius:20px;flex:0 0 auto}
  .idate{font-size:11.5px;color:var(--muted);margin-bottom:9px}
  .ibody{font-size:14.5px;line-height:1.75;white-space:pre-wrap}
  .msg{text-align:center;color:var(--muted);padding:34px 14px;font-size:14px}
  .empty-ic{font-size:30px;display:block;margin-bottom:10px;opacity:.7}
</style>
</head>

    <div class="brand"><h1>إعلانات مهمة</h1><p>مدرسة المعيريض للحلقة الثانية بنين</p></div></div>
  <div id="body"><div class="msg">… جارٍ التحميل</div></div>
</div>
<script>
(function(){
  var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  function fmtDate(iso){ if(!iso) return ''; var p=iso.split('-'); if(p.length!==3) return iso; return (+p[2])+' '+MONTHS[(+p[1])-1]+' '+p[0]; }
  function isNew(iso){ if(!iso) return false; var d=new Date(iso+'T00:00:00'); var diff=(Date.now()-d.getTime())/86400000; return diff>=0 && diff<=3; }
  function render(news){
    var body=document.getElementById('body');
    if(!news||!news.length){ body.innerHTML='<div class="msg"><span class="empty-ic">📣</span>لا توجد إعلانات حالياً.<br>ستظهر هنا فور نشرها.</div>'; return; }
    var html='<div class="news">';
    news.forEach(function(n){
      html+='<div class="item'+(n.pinned?' pin':'')+'"><div class="ih">'+
        (n.pinned?'<span class="pinmark">📌</span>':'')+
        '<span class="t">'+esc(n.title)+'</span>'+
        (isNew(n.date)?'<span class="badge-new">جديد</span>':'')+'</div>'+
        (n.date?'<div class="idate">'+esc(fmtDate(n.date))+'</div>':'')+
        (n.body?'<div class="ibody">'+esc(n.body)+'</div>':'')+'</div>';
    });
    html+='</div>';
    body.innerHTML=html;
  }
  fetch('/.netlify/functions/plan',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){ render(j&&j.news); })
   .catch(function(){ document.getElementById('body').innerHTML='<div class="msg">تعذّر التحميل. حدّث الصفحة بعد قليل.</div>'; });
})();
</script>
</body>
